name: Build DropIt Multi-Platform Executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DropIt-Windows.exe
            asset_path: dist/DropIt.exe
          - os: macos-latest
            artifact_name: DropIt-macOS
            asset_path: dist/DropIt
          - os: ubuntu-latest
            artifact_name: DropIt-Linux
            asset_path: dist/DropIt

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon=assets/logo.ico --add-data "assets;assets" --name DropIt main.py

    - name: Build Executable with PyInstaller (macOS / Linux)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "assets:assets" --name DropIt main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.asset_path }}

    - name: Upload Release Asset to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.asset_path }}

